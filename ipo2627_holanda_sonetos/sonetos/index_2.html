<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Sonetos</title>

    <style>
        /* VARIABLES DE TEMA (MODO CLARO POR DEFECTO) */
        :root {
            --bg-color: #f7f4ef;
            --card-bg: #fffdf9;
            --border-color: #e2d9cc;
            --text-main: #2c2c2c;
            --text-title: #4a2e1b;
            --text-muted: #7a6a58;
            --item-bg: #f9f6f0;
            --item-hover-bg: #4a2e1b;
            --item-hover-text: #fffdf9;
            --input-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.06);
            --tooltip-bg: #2c2c2c;
            --tooltip-text: #ffffff;
            --reader-font-family: 'Georgia', serif;
        }

        /* TEMA OSCURO */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #242424;
            --border-color: #3d3d3d;
            --text-main: #e0e0e0;
            --text-title: #d4a373;
            --text-muted: #a0a0a0;
            --item-bg: #2d2d2d;
            --item-hover-bg: #d4a373;
            --item-hover-text: #1a1a1a;
            --input-bg: #2d2d2d;
            --shadow: rgba(0, 0, 0, 0.4);
            --tooltip-bg: #e0e0e0;
            --tooltip-text: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-title);
            font-family: 'Georgia', serif;
        }

        /* BARRA SUPERIOR DE HERRAMIENTAS */
        .toolbar {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px 20px;
            box-shadow: 0 4px 10px var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--text-title);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* SELECTOR DE TIPOGRAFÍA */
        .font-family-selector select {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            outline: none;
        }

        /* SLIDER DE TAMAÑO DE FUENTE */
        .font-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .font-slider-container label {
            font-weight: bold;
            color: var(--text-title);
            user-select: none;
        }

        .font-slider-container input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .font-slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-title);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .font-slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .font-value-display {
            min-width: 35px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* BOTÓN MODO CLARO / OSCURO */
        .theme-toggle-btn {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .theme-toggle-btn:hover {
            background-color: var(--border-color);
        }

        /* DISEÑO PRINCIPAL (DOS COLUMNAS) */
        .reader-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* MARCADOR DE TÍTULOS */
        .bookmark-menu {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px var(--shadow);
            height: fit-content;
        }

        .bookmark-menu h2 {
            font-size: 1.2rem;
            color: var(--text-title);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
            font-family: 'Georgia', serif;
        }

        .bookmark-list {
            list-style: none;
        }

        .bookmark-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            background-color: var(--item-bg);
            color: var(--text-main);
            font-weight: bold;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .bookmark-item:hover, .bookmark-item.active {
            background-color: var(--item-hover-bg);
            color: var(--item-hover-text);
        }

        .bookmark-item.hidden {
            display: none;
        }

        /* VISOR DEL SONETO */
        .sonnet-display {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 15px var(--shadow);
            min-height: 380px;
        }

        .soneto-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .soneto-title {
            font-size: 1.8rem;
            color: var(--text-title);
            margin-bottom: 5px;
            font-family: 'Georgia', serif;
        }

        /* ESTILO INTERACTIVO PARA EL AUTOR */
        .soneto-author {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-style: italic;
            cursor: pointer;
            display: inline-block;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s ease, transform 0.1s ease;
        }

        .soneto-author:hover {
            color: var(--text-title);
            transform: scale(1.03);
        }

        /* CUERPO DEL SONETO CON FUENTE DINÁMICA */
        .soneto-body {
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap;
            text-align: center;
            font-family: var(--reader-font-family);
        }

        .placeholder-text {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            margin-top: 120px;
        }

        /* TOOLTIP DINÁMICO QUE SIGUE AL CURSOR */
        .cursor-tooltip {
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--tooltip-bg);
            color: var(--tooltip-text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            white-space: nowrap;
        }

        .cursor-tooltip.visible {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 768px) {
            .reader-layout { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .controls-group { justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div id="cursorTooltip" class="cursor-tooltip"></div>

    <header>
        <h1>Lector de Sonetos</h1>
    </header>

    <!-- BARRA SUPERIOR DE HERRAMIENTAS -->
    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por título o autor..." oninput="filtrarSonetos()" aria-label="Buscar sonetos">
        </div>

        <div class="controls-group">
            <!-- SELECTOR DE FORMATO/TIPO DE LETRA -->
            <div class="font-family-selector">
                <select id="fontSelect" onchange="cambiarTipoFuente(this.value)" aria-label="Seleccionar tipografía">
                    <option value="'Georgia', serif">Georgia (Clásica)</option>
                    <option value="'Garamond', serif">Garamond (Elegante)</option>
                    <option value="'Courier New', monospace">Courier (Mecanografía)</option>
                    <option value="'Segoe UI', sans-serif">Segoe UI (Moderna)</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans (Informal)</option>
                </select>
            </div>

            <!-- SLIDER DE TAMAÑO DE FUENTE -->
            <div class="font-slider-container">
                <label for="fontSizeRange">A</label>
                <input 
                    type="range" 
                    id="fontSizeRange" 
                    min="12" 
                    max="32" 
                    value="18" 
                    step="1" 
                    oninput="actualizarTamanoFuente(this.value)"
                    aria-label="Ajustar tamaño de fuente"
                >
                <span class="font-value-display" id="fontSizeLabel">18px</span>
            </div>

            <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTema()" aria-label="Cambiar tema">🌙 Oscuro</button>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div class="reader-layout">
        <aside class="bookmark-menu">
            <h2>Marcador</h2>
            <ul class="bookmark-list" id="bookmarkList"></ul>
        </aside>

        <main class="sonnet-display" id="sonnetDisplay">
            <p class="placeholder-text">Cargando sonetos...</p>
        </main>
    </div>

    <script>
        const bookmarkList = document.getElementById('bookmarkList');
        const sonnetDisplay = document.getElementById('sonnetDisplay');
        const tooltip = document.getElementById('cursorTooltip');
        
        let tamanoFuentePixels = localStorage.getItem('fontSize') || 18;
        let tipoFuenteActual = localStorage.getItem('fontFamily') || "'Georgia', serif";

        // INICIALIZACIÓN DE PREFERENCIAS
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

            document.getElementById('fontSizeRange').value = tamanoFuentePixels;
            document.getElementById('fontSizeLabel').textContent = `${tamanoFuentePixels}px`;
            
            document.getElementById('fontSelect').value = tipoFuenteActual;
            document.documentElement.style.setProperty('--reader-font-family', tipoFuenteActual);
        });

        // CARGA AUTOMÁTICA DE ARCHIVOS EN /sonetos
        async function cargarTodosLosSonetos() {
            try {
                const response = await fetch('sonetos/');
                if (!response.ok) throw new Error("No se pudo acceder a la carpeta sonetos/");

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const enlaces = Array.from(doc.querySelectorAll('a'));

                const archivosMd = enlaces
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && href.toLowerCase().endsWith('.md'))
                    .map(href => href.split('/').pop());

                const listaArchivos = [...new Set(archivosMd)];

                if (listaArchivos.length === 0) {
                    sonnetDisplay.innerHTML = `<p class="placeholder-text">No se encontraron archivos .md en la carpeta sonetos/.</p>`;
                    return;
                }

                bookmarkList.innerHTML = '';
                sonnetDisplay.innerHTML = `<p class="placeholder-text">Selecciona un soneto del marcador...</p>`;

                for (let i = 0; i < listaArchivos.length; i++) {
                    const nombreArchivo = listaArchivos[i];

                    try {
                        const resSoneto = await fetch(`sonetos/${nombreArchivo}`);
                        if (!resSoneto.ok) continue;

                        const texto = await resSoneto.text();

                        // PARSER FLEXIBLE (Soporta Título con/sin tilde y comillas opcionales)
                        const tituloMatch = texto.match(/T[íi]tulo:\s*"?([^"\r\n]+)"?/i);
                        const autorMatch = texto.match(/Autor:\s*"?([^"\r\n]+)"?/i);

                        const titulo = tituloMatch ? tituloMatch[1].trim() : nombreArchivo.replace('.md', '');
                        const autor = autorMatch ? autorMatch[1].trim() : 'Anónimo';

                        // LIMPIEZA DEL ENCABEZADO
                        let cuerpo = texto
                            .replace(/T[íi]tulo:\s*"?[^"\r\n]+"?/i, '')
                            .replace(/Autor:\s*"?[^"\r\n]+"?/i, '')
                            .replace(/^Soneto\s*/i, '')
                            .trim();

                        const li = document.createElement('li');
                        li.className = 'bookmark-item';
                        li.textContent = titulo;
                        li.tabIndex = 0;

                        li.dataset.titulo = titulo.toLowerCase();
                        li.dataset.autor = autor.toLowerCase();

                        // TOOLTIP DINÁMICO CON DETECCIÓN DE BORDES
                        li.onmouseenter = () => {
                            tooltip.textContent = `Autor: ${autor}`;
                            tooltip.classList.add('visible');
                        };

                        li.onmousemove = (e) => {
                            let x = e.clientX + 15;
                            let y = e.clientY + 15;

                            if (x + tooltip.offsetWidth > window.innerWidth) {
                                x = e.clientX - tooltip.offsetWidth - 10;
                            }
                            if (y + tooltip.offsetHeight > window.innerHeight) {
                                y = e.clientY - tooltip.offsetHeight - 10;
                            }

                            tooltip.style.transform = `translate(${x}px, ${y}px)`;
                        };

                        li.onmouseleave = () => {
                            tooltip.classList.remove('visible');
                        };

                        const seleccionarSoneto = () => {
                            document.querySelectorAll('.bookmark-item').forEach(el => el.classList.remove('active'));
                            li.classList.add('active');

                            sonnetDisplay.innerHTML = `
                                <div class="soneto-header">
                                    <h2 class="soneto-title">${titulo}</h2>
                                    <p class="soneto-author" onclick="filtrarPorAutor('${autor}')" title="Haz clic para ver todas las obras de ${autor}">
                                        ${autor}
                                    </p>
                                </div>
                                <div class="soneto-body" id="sonnetBody" style="font-size: ${tamanoFuentePixels}px;">${cuerpo}</div>
                            `;
                        };

                        li.onclick = seleccionarSoneto;
                        li.onkeydown = (e) => { if (e.key === 'Enter') seleccionarSoneto(); };

                        bookmarkList.appendChild(li);

                    } catch (err) {
                        console.error(`Error procesando ${nombreArchivo}:`, err);
                    }
                }

            } catch (error) {
                console.error("Error al acceder a la carpeta:", error);
                sonnetDisplay.innerHTML = `
                    <p style="color: #c0392b; font-weight: bold; text-align: center;">
                        No se pudo leer la carpeta <code>sonetos/</code>.
                    </p>
                    <p style="text-align: center; font-size: 0.9rem; margin-top: 10px;">
                        Asegúrate de ejecutar la web con un servidor local (p. ej. Live Server en VS Code).
                    </p>
                `;
            }
        }

        // FILTRADO GENERAL
        function filtrarSonetos() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const items = document.querySelectorAll('.bookmark-item');

            items.forEach(item => {
                const titulo = item.dataset.titulo || '';
                const autor = item.dataset.autor || '';

                if (titulo.includes(query) || autor.includes(query)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        }

        // FILTRADO AL HACER CLIC EN EL NOMBRE DEL AUTOR
        function filtrarPorAutor(nombreAutor) {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = nombreAutor;
            filtrarSonetos();
            searchInput.focus();
        }

        function cambiarTipoFuente(nuevaFuente) {
            tipoFuenteActual = nuevaFuente;
            document.documentElement.style.setProperty('--reader-font-family', nuevaFuente);
            localStorage.setItem('fontFamily', nuevaFuente);
        }

        function actualizarTamanoFuente(nuevoTamano) {
            tamanoFuentePixels = nuevoTamano;
            document.getElementById('fontSizeLabel').textContent = `${nuevoTamano}px`;
            localStorage.setItem('fontSize', nuevoTamano);

            const cuerpoSoneto = document.getElementById('sonnetBody');
            if (cuerpoSoneto) {
                cuerpoSoneto.style.fontSize = `${nuevoTamano}px`;
            }
        }

        function toggleTema() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').textContent = newTheme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
            localStorage.setItem('theme', newTheme);
        }

        cargarTodosLosSonetos();
    </script>

</body>
</html>
